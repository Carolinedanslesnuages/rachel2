name: Signaler un problème
description: Quelque chose ne fonctionne pas comme prévu
labels: ["bug"]
body:
  - type: textarea
    id: constate
    attributes:
      label: Ce qui se passe
      description: Ce que vous voyez, tel quel (message d'erreur, écran…)
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Ce qui devrait se passer
    validations:
      required: true
  - type: textarea
    id: etapes
    attributes:
      label: Comment le reproduire
      description: Les étapes, une par ligne
      value: |
        1. 
    validations:
      required: true
  - type: input
    id: ecran
    attributes:
      label: Écran ou adresse concerné
      placeholder: /ma-page
